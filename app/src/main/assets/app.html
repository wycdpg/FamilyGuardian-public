<script>window.onerror=function(m,s,l,c){document.title="ERR:"+m+" line:"+l+" col:"+c;};

function ecgWaveCanvas(wave,w,h){
  if(typeof wave==='string'){try{wave=JSON.parse(wave);}catch(e){wave=null;}}
  if(!wave)wave=[];
  var cv=document.createElement('canvas');cv.width=w;cv.height=h;var ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  // grid
  ctx.strokeStyle='#F2D6D6';ctx.lineWidth=1;
  for(var gx=0;gx<=w;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,h);ctx.stroke();}
  for(var gy=0;gy<=h;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();}
  // filter placeholder values
  var vals=[];for(var i=0;i<wave.length;i++){var v=+wave[i];if(isFinite(v)&&v>-2147483000&&v<2147483000)vals.push(v);}
  if(!vals.length)return cv;
  vals=ecgDetrend(vals);
  // 1%-99% quantile for range（保住QRS波峰）
  var sorted=vals.slice().sort(function(a,b){return a-b;});
  var lo=sorted[Math.floor(sorted.length*0.01)];var hi=sorted[Math.floor(sorted.length*0.99)];
  if(hi<=lo){lo=sorted[0];hi=sorted[sorted.length-1];}
  var range=hi-lo;if(range<=0)range=1;
  // 每列取“最偏离均值的点”，保住波峰
  var bs=vals.length/w;
  ctx.strokeStyle='#E8402A';ctx.lineWidth=2;ctx.beginPath();
  var midY=h*0.55;var amp=h*0.35;var firstPt=true;
  for(var px=0;px<w;px++){
    var st=Math.floor(px*bs);if(st>=vals.length)break;
    var en=Math.min(vals.length,Math.max(st+1,Math.floor((px+1)*bs)));
    var sum=0;for(var k=st;k<en;k++)sum+=vals[k];
    var mid=sum/(en-st),pick=vals[st],best=-1;
    for(var k2=st;k2<en;k2++){var dd=Math.abs(vals[k2]-mid);if(dd>best){best=dd;pick=vals[k2];}}
    var n=(pick-lo)/range;
    var y=midY-amp*(n*2-1);
    if(firstPt){ctx.moveTo(px,y);firstPt=false;}else ctx.lineTo(px,y);
  }
  ctx.stroke();
  // title
  ctx.fillStyle='#4A3428';ctx.font='bold 24px Microsoft YaHei';

var BR={hist:[],consec:0,level:"ok",score:0,reasons:[],alerts:"0 条"};
function brEval(list){var res={score:0,level:"ok",reasons:[]};var clean=[],i;for(i=0;i<list.length;i++){var p=list[i];if(p&&p.hr>=40&&p.hr<=180&&p.spo2>=80&&p.spo2<=100)clean.push(p);}list=clean;if(list.length<3)return res;
  var base=list.slice(0,Math.max(3,list.length-2));var avg=function(k){var t=0;for(var i=0;i<base.length;i++)t+=base[i][k];return t/base.length;};
  var hb=avg("hr"),sb=avg("spo2");var cur=list[list.length-1],prev=list[list.length-2];var sc=0,r=[];
  if(cur.spo2<=88){sc+=4;r.push("血氧降到 "+cur.spo2+"%（严重偏低）");}
  else if(cur.spo2<=92){sc+=3;r.push("血氧降到 "+cur.spo2+"%（低于92）");}
  else if(cur.spo2<=94&&BR.consec>=1){sc+=2;r.push("血氧连续偏低（约94%）");}
  if(prev.spo2-cur.spo2>=4&&cur.spo2<=93){sc+=2;r.push("血氧较上次骤降 "+(prev.spo2-cur.spo2)+"%");}
  if(cur.hr>=130||(cur.hr>=hb*1.35&&cur.hr>=110)){sc+=2;r.push("心率 "+cur.hr+" 次/分异常升高（平时约 "+Math.round(hb)+"）");}
  if(cur.hr<45){sc+=3;r.push("心率 "+cur.hr+" 次/分过低");}
  if(prev.spo2-cur.spo2>=4&&cur.hr-prev.hr>=15){sc+=2;r.push("血氧骤降同时心率飙升");}
  BR.consec=(cur.spo2<=94)?BR.consec+1:0;
  res.score=sc;res.reasons=r;res.level=(sc>=5)?"alert":(sc>=3?"watch":"ok");return res;}
function brStatus(){if(BR.level==="alert")return {level:"alert",ico:"🚨",banner:"呼吸风险：请注意",text:"<span class=\"red\">⚠️ 风险</span>",cls:"red",reasons:BR.reasons,alerts:BR.alerts};

// 真实数据评估：用最近7天记录里最新12条“心率+血氧都有值”的数据跑一次呼吸困难评分
function brRealEval(){
  var rows=[],i;
  for(i=D.recs.length-1;i>=0&&rows.length<12;i--){var r=D.recs[i];if(r&&r.hr>0&&r.spo2>0)rows.unshift({spo2:r.spo2,hr:r.hr});}
  if(rows.length<3)return;
  BR.hist=rows;
  var res=brEval(BR.hist);
  var prev=BR.level;
  BR.level=res.level;BR.score=res.score;BR.reasons=res.reasons;
  if(res.level==="alert"){BR.alerts="1 条";if(prev!=="alert")toast("🚨 呼吸风险升高，已提醒子女端");}
  else if(res.level==="watch"){if(prev==="ok")toast("🫁 呼吸有点波动，继续观察");}
  else{BR.alerts="0 条";}
}

S['d_about_heart']=function(){return head('了解心率','📖')+'<div class="card"><h3>心率解释</h3><div class="para">心率是指心脏每分钟跳动的次数，成年人安静状态下的心率一般为 55～80 次/分钟，其通常会因年龄、性别或其他生理因素产生个体差异。运动时心跳会加速，心肺功能较好的运动员心率通常会比普通成人的心跳要慢。</div></div><div class="card"><h3>心率区间</h3><div class="para">· 最大心率的50%-60%为热身区间，适用于跑步前的动态热身、跑步后的放松活动。<br/>· 61%-70%为燃脂区间，身体主要通过燃烧脂肪的方式为运动供能。<br/>· 71%-80%为有氧区间，能有效锻炼心肺功能。<br/>· 81%-90%为无氧区间，乳酸堆积量增加。<br/>· 91%-100%为极限区间，心脏负担很大。低于最大心率50%的数据不在区间中统计。</div></div><div class="card"><h3>静息心率</h3><div class="para">静息心率，又称为安静心率，是指在清醒、不活动的安静状态下，每分钟心跳的次数。依靠运动使心功能得到锻炼、保持适当体重、戒烟与限酒等均可使静息心率保持在一个相对缓慢而稳定的区间。</div></div><div class="card"><h3>心率变化</h3><div class="para">安静状态下心率超过160次/分钟，或低于40次/分钟的现象大多见于心脏疾病患者，如伴随心悸、胸闷等不适感，应及早进行详细检查。</div></div><div class="card"><h3>正确看待心率变化</h3><div class="para">很多人都会有窦性心动过缓伴不齐，对于多数人来说是正常的，不必过于担心。安静状态下成年人的心率若在50～60次/分钟一般不会出现明显症状。但出现胸闷、乏力、头晕等不适，应立即到医院进一步检查。</div></div><div class="card"><h3>心率相关建议</h3><div class="para">· 养成良好的生活和作息方式，避免或减少熬夜、饮酒、喝浓茶和吸烟等行为。<br/>· 保持良好的运动习惯，建议每周至少坚持3次运动，每次运动30～60分钟。<br/>· 保持适当体重，调节饮食习惯，避免因肥胖导致心脏负担增加。<br/>· 保持平和的心态，避免因着急、生气、紧张等因素导致心率过快。<br/>· 若因高血压、冠心病等疾病导致心率加快，可遵医嘱服用药物。</div></div><div class="tip">⚠️ 心率监测仅用于参考，不能用于诊断或治疗任何疾病，如有担心请咨询专业医疗人士。</div>';};

S['d_about_sugar']=function(){return head('了解血糖','📖')+'<div class="card"><h3>血糖是什么</h3><div class="para">血糖是血液中的葡萄糖，是身体最主要的能量来源之一。一般成年人空腹血糖参考范围为 3.9～6.1 毫摩尔/升，餐后2小时血糖一般不超过 7.8 毫摩尔/升。</div></div><div class="card"><h3>血糖偏高</h3><div class="para">血糖持续偏高常见于糖尿病或糖调节异常，可能伴有多饮、多尿、容易饿、乏力等表现。老年人血糖波动大，建议结合指尖血糖仪或医院检查确认。</div></div><div class="card"><h3>血糖偏低</h3><div class="para">血糖低于 3.9 毫摩尔/升属于低血糖，可能出现心慌、出汗、手抖、头晕，严重时会意识模糊。老年人低血糖比高血糖更紧急，反复出现应及时就医。</div></div><div class="card"><h3>手环血糖说明</h3><div class="para">手环血糖是光学估算值，受佩戴松紧、肤色、运动等因素影响，只能用来看趋势，不能代替指尖血糖仪和医院的静脉血糖检查，也不能作为调药依据。</div></div><div class="tip">⚠️ 本页内容仅供参考，不能用于诊断或治疗；如有疑问请咨询医生。</div>';};
S['d_about_hrv']=function(){return head('了解HRV','📖')+'<div class="card"><h3>HRV是什么</h3><div class="para">HRV（心率变异性）指每次心跳之间时间间隔的变化程度，反映身体自主神经系统（交感神经与副交感神经）的平衡状态。</div></div><div class="card"><h3>数值怎么看</h3><div class="para">一般成年人静息 HRV 多在 20～100 毫秒之间，个体差异很大。HRV 较高通常说明身体恢复能力较好、比较放松；HRV 偏低可能与疲劳、紧张、睡眠不足、年龄增长等因素有关。</div></div><div class="card"><h3>什么时候需要留意</h3><div class="para">单次偏低不必紧张。如果 HRV 在一段时间内明显持续下降，并且伴随心慌、胸闷、明显疲劳等不舒服，建议尽早就医检查。</div></div><div class="card"><h3>怎么改善</h3><div class="para">规律作息、充足睡眠、适度运动、放松训练（如深呼吸、冥想）都有助于提高 HRV。避免熬夜、过量饮酒和长期精神紧张。</div></div><div class="tip">⚠️ HRV 只是辅助参考指标，不能单独用来诊断疾病，如有担心请咨询专业医疗人士。</div>';};

S['d_about_sleep']=function(){return head('了解睡眠','📖')+'<div class="card"><h3>名词解释</h3><div class="para">睡眠并非简单的“关机休息”，而是人体复杂且活跃的生理修复过程。睡眠周期是指从浅睡到深睡再到浅睡的完整循环，成年人每夜通常经历4-6个周期。</div></div><div class="card"><h3>睡眠周期</h3><div class="para">· <b>入睡期（约5%）</b>：清醒与睡眠之间的过渡，非常浅眠，易被唤醒。<br/>· <b>浅睡期（约50%）</b>：占比最长的阶段，是进入深度睡眠的“缓冲区”。<br/>· <b>深睡期（约15-25%）</b>：睡眠的“黄金修复期”，身体进行最彻底的放松与修复。<br/>· <b>快速眼动睡眠期（约20-25%）</b>：大脑变得异常活跃，大多数梦境发生于此。</div></div><div class="card"><h3>睡眠质量</h3><div class="para">优质睡眠的特征：入睡时间不超过30分钟；夜间醒来不超过1次，且醒后能迅速重新入睡；深睡和REM睡眠比例适当；早晨醒来感觉精神焕发。</div></div><div class="card"><h3>影响睡眠质量的因素</h3><div class="para">· 作息规律：每天大致相同的时间上床和起床。<br/>· 睡眠环境：黑暗、安静、温度适宜（约18-22℃）。<br/>· 睡前习惯：避免蓝光暴露、咖啡因和大量进食。<br/>· 日间活动：适量的运动有助于夜间睡眠，但睡前剧烈活动可能适得其反。</div></div><div class="tip">⚠️ 以上内容仅供参考，不能作为诊断或治疗依据。</div>';};

%')],['交感神经活跃度',(r.sympa==null?'--':r.sympa)],['皮质醇浓度',(r.cortisol==null?'--':r.cortisol+' 微克/升'),(r.cortisol==null?'':bcl(r.cortisol,0,200))]])+'</div>':'')+REFMICRO+'<div class="bigbtn" onclick="startMicro()">开始微体检<small>坐着别动 · 约1~2分钟出结果</small></div>'+fr('d_micro_data','📊','全部数据','以往报告')+'<div class="tip">📋 结果保存在手机里，可翻看最近几次对比；疾病诊断请以医院检查为准。</div>';};

function ecgDetrend(vals){var win=Math.max(3,Math.floor(vals.length/40));var half=Math.floor(win/2);var out=[],i;for(i=0;i<vals.length;i++){var st=Math.max(0,i-half),en=Math.min(vals.length,i+half+1);var sum=0;for(var k=st;k<en;k++)sum+=vals[k];out.push(vals[i]-sum/(en-st));}return out;}

function ecgWaveSvg(wv,opts){opts=opts||{};if(typeof wv==='string'){try{wv=JSON.parse(wv);}catch(e){wv=null;}}if(!wv)wv=[];var w=opts.w||640,hh=opts.hh||160,sw=opts.sw||1.4,maxPts=opts.maxPoints||w,seconds=(opts.seconds===undefined?10:opts.seconds);if(!wv||!wv.length)return'';var i,vals=[];for(i=0;i<wv.length;i++){var v=+wv[i];if(isFinite(v)&&Math.abs(v)<2147483000)vals.push(v);}if(!vals.length)return '<div class="tip">波形里都是占位值，暂不能画图</div>';vals=ecgDetrend(vals);if(seconds>0){var maxN=seconds*500;if(maxN>0&&vals.length>maxN)vals=vals.slice(0,maxN);}var sm=[];for(i=0;i<vals.length;i++){var a=vals[Math.max(0,i-1)],b=vals[i],c=vals[Math.min(vals.length-1,i+1)];sm.push((a+b+c)/3);}if(sm.length>maxPts){var bs=sm.length/maxPts,ds=[];for(i=0;i<maxPts;i++){var st=Math.floor(i*bs),en=Math.min(sm.length,Math.floor((i+1)*bs)+1);var sum=0;for(var k=st;k<en;k++)sum+=sm[k];var mid=sum/(en-st),pick=sm[st],best=-1;for(var k2=st;k2<en;k2++){var d=Math.abs(sm[k2]-mid);if(d>best){best=d;pick=sm[k2];}}ds.push(pick);}sm=ds;}var sort=sm.slice().sort(function(x,y){return x-y;});var lo=sort[Math.floor(sort.length*0.01)],hi=sort[Math.ceil(sort.length*0.99)-1];if(!(hi-lo>1e-6)){lo=sort[0];hi=sort[sort.length-1];}if(hi-lo<1e-6){lo-=10;hi+=10;}var pts='';for(i=0;i<sm.length;i++){var v2=Math.max(lo,Math.min(hi,sm[i]));var x=(sm.length>1)?(i*w/(sm.length-1)).toFixed(1):'0.0';var y=(hh-10-(v2-lo)*(hh-20)/(hi-lo)).toFixed(1);pts+=x+','+y+' ';}var grid='';for(var gx=0;gx<=w;gx+=40){grid+='<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+hh+'" stroke="#F2D6D6" stroke-width="1"/>';}for(var gy=0;gy<=hh;gy+=20){grid+='<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="#F2D6D6" stroke-width="1"/>';}return '<svg viewBox="0 0 '+w+' '+hh+'" style="width:100%;background:#fff;border:1px solid #E5E7EB;border-radius:8px"><rect width="'+w+'" height="'+hh+'" fill="#fff"/>'+grid+'<polyline points="'+pts.trim()+'" fill="none" stroke="#E8402A" stroke-width="'+sw+'" stroke-linejoin="round" stroke-linecap="round"/></svg>';}

S['d_ecg']=function(){var prog=(D.ecgProg!=null&&D.ecgProg>=0)?'<div class="card"><h3>测量中… '+D.ecgProg+'%</h3><div class="tl"><div style="width:'+Math.max(4,D.ecgProg)+'%;background:#E8402A"></div></div><div class="tip">⏱ 手环戴紧，手指捏住两个电极，保持不动，持续30秒。</div></div>':'';var r=D.ecg;var wv=(r&&r.wave&&r.wave.length)?'<div class="card"><h3>心电图波形</h3>'+ecgWaveSvg(r.wave)+'<div class="legend"><span><i style="background:#E8402A"></i>心电波形</span><span>测量当时30秒记录</span></div></div>':'';var last=r?'<div class="card"><h3>最近一次记录</h3>'+rows([['⏱ 时间',hmOf(new Date(r.t))],['❤️ 平均心率',(r.hr==null?'--':r.hr+' 次/分'),'green'],['📈 HRV',(r.hrv==null?'--':r.hrv+' 毫秒'),'green'],...(r.br>0?[['🫁 呼吸率',r.br+' 次/分','green']]:[]),['QT间期',(r.qt==null?'--':r.qt)],...(r.press>0?[['压力指数',r.press]]:[]),...(r.fatig>0?[['疲劳指数',r.fatig]]:[]),['结果',r.type,(r.type&&r.type.indexOf('异常')>=0)?'orange':'green']])+'</div>'+(function(){var rk=[];if(r.myo!=null)rk.push(['🛡 心肌炎风险',(r.myo==0?'正常':String(r.myo)),(r.myo==0?'green':'orange')]);if(r.chd!=null)rk.push(['🫀 冠心病风险',(r.chd==0?'正常':String(r.chd)),(r.chd==0?'green':'orange')]);if(r.ang!=null)rk.push(['🩸 血管硬化风险',(r.ang==0?'正常':String(r.ang)),(r.ang==0?'green':'orange')]);if(r.dis!=null&&r.dis!=0)rk.push(['⚠ 综合疾病风险',String(r.dis),'orange']);if(!rk.length)return '';return '<div class="card"><h3>风险分析</h3>'+rows(rk)+'</div><div class="tip">⚠ 风险提示仅供辅助参考，不能替代医生诊断。</div>';})():'<div class="tip">还没有心电图记录，点下面按钮开始。</div>';return head('心电图','🫀')+prog+wv+last+'<div class="frow" onclick="saveEcgImg()"><div class="l">💾 保存完整心电图</div><div class="r">存到手机相册<span class="chev">›</span></div></div>'+'<div class="bigbtn" onclick="startEcg()">开始测量<small>手指捏住电极 · 持续30秒</small></div>'+fr('d_ecg_data','📊','全部数据','历史记录')+fr('d_about_ecg','📖','了解心电图','科普')+'<div class="tip">🫀 心电图是点一下测一次；如感觉胸闷心慌等不适，请及时就医。</div>';};

S['d_about_ecg']=function(){return head('了解心电图','📖')+'<div class="card"><h3>心电图是什么</h3><div class="para">心脏跳动时会有微弱的电信号，心电图就是把这种电信号记录成的一条曲线。它能反映心跳的节律、快慢，以及有无常见的异常信号，是最常用的心脏检查之一。</div></div><div class="card"><h3>数值怎么看</h3><div class="para">· 平均心率：安静时一般 60～100 次/分。<br/>· HRV：40 毫秒以上较理想，越低越提示疲劳或紧张。<br/>· QT间期、波形细节：主要由医生解读，老人不必自己研究。<br/>· 结果提示“异常”：不用惊慌，只是提醒需要留意或复查；单次记录受手指松紧、呼吸、身体乱动影响很大。</div></div><div class="card"><h3>老年人常见情况</h3><div class="para">老年人比较常见的有心跳偏慢、早搏、房颤等。房颤会增加中风风险，值得重视；偶发早搏在健康老人中也很常见。手环记录只能做参考，提示异常时建议多测几次，并去医院做正规心电图。</div></div><div class="card"><h3>什么时候要及时就医</h3><div class="para">出现持续心慌、胸闷、胸痛、明显头晕、眼前发黑、气短等情况，不要等测量结果，尽快就医。</div></div><div class="tip">⚠️ 本页内容仅供参考，不能用于诊断；具体请听医生意见。</div>';};
S['d_body_data']=function(){var h=histGet('fg_body_hist');var list;if(h.length){list=h.map(function(x,i){var d=new Date(x.t);return rowC((d.getMonth()+1)+'月'+d.getDate()+'日 '+hmOf(d),'BMI'+(x.bmi==null?'--':x.bmi)+' · 体脂'+(x.bfr==null?'--':x.bfr+'%')+' · 水分'+(x.water==null?'--':x.water+'%'),'green',"openHist('fg_body_hist',"+i+')');}).join('');}else{list='<div class="tip">📊 还没有身体成分记录，去“身体成分”页测一次。</div>';}return head('身体成分 · 全部数据','📊')+'<div class="card"><h3>以往报告（点一条看详情）</h3>'+list+'</div><div class="tip">📊 保留最近7次报告；点任意一条可看完整数值。</div>';};
S['d_about_body']=function(){return head('了解身体成分','📖')+'<div class="card"><h3>各指标是什么</h3><div class="para">· BMI：体重和身高的比值，18.5～23.9 较合适。<br/>· 体脂率：脂肪占体重的比例，女 20～25%、男 15～20% 较好，偏高会增加心脏和血管负担。<br/>· 体水分：身体水分占比，50～65% 较好；偏低常见于喝水少、年龄增长或营养不足。<br/>· 肌肉量/骨量/蛋白质：会随年龄慢慢流失，是老年人最该留意的。<br/>· 基础代谢：身体安静时消耗的能量，偏低说明肌肉偏少。</div></div><div class="card"><h3>老年人要注意什么</h3><div class="para">老年人不要盲目追求“瘦”，重点是保住肌肉和骨头：每天吃够蛋白质（蛋、奶、鱼、瘦肉、豆制品），每天足量喝水，适当散步、晒太阳、做轻度力量活动。体脂偏高的人，先从每天多走路、少油少糖开始。</div></div><div class="card"><h3>怎么用这些数值</h3><div class="para">每周测一次看趋势就够了，不必天天测。如果体重快速下降、肌肉量持续减少，或多项指标同时变差，建议告诉子女并去医院检查。</div></div><div class="tip">⚠️ 手环测量是估算值，仅供参考；体检报告和医院测量更准确。</div>';};

S['d_about_blood']=function(){return head('了解血液成分','📖')+'<div class="card"><h3>各指标是什么</h3><div class="para">· 尿酸（150～430 微摩尔/升）：偏高可能诱发痛风，表现为关节突然红肿疼痛，大脚趾常见。<br/>· 总胆固醇（2.8～5.7 毫摩尔/升）：偏高会让血管慢慢变硬变窄，增加心梗、中风风险。<br/>· 甘油三酯（0.45～1.7 毫摩尔/升）：偏高与油腻饮食、甜食、喝酒关系大。<br/>· 高密度脂蛋白（≥1.0）：俗称“好胆固醇”，越高越好。<br/>· 低密度脂蛋白（≤3.4）：俗称“坏胆固醇”，偏高会促进血管斑块。</div></div><div class="card"><h3>老年人要注意什么</h3><div class="para">· 少喝浓肉汤、啤酒、含糖饮料；每天喝够水。<br/>· 饮食清淡，少油炸、少甜食，多吃蔬菜和粗粮。<br/>· 指标偏高时先调整生活方式，严重偏高要在医生指导下用药，不要自己乱吃药。</div></div><div class="card"><h3>手环测量的局限</h3><div class="para">手环是光学估算，受佩戴位置、皮肤状态影响，只能看趋势变化，不能代替医院抽血化验。指标异常时，以医院化验为准。</div></div><div class="tip">⚠️ 本页内容仅供参考，不能用于诊断；具体请听医生意见。</div>';};
S['d_gsr_data']=function(){var h=histGet('fg_gsr_hist');var list;if(h.length){list=h.map(function(x,i){var d=new Date(x.t);return rowC((d.getMonth()+1)+'月'+d.getDate()+'日 '+hmOf(d),'含水'+(x.skinWater==null?'--':x.skinWater+'%')+' · 皮质醇'+(x.cortisol==null?'--':x.cortisol)+' · 情绪'+(x.emotion==null?'--':x.emotion),'green',"openHist('fg_gsr_hist',"+i+')');}).join('');}else{list='<div class="tip">📊 还没有皮肤电活动记录，去“皮肤电活动”页测一次。</div>';}return head('皮肤电活动 · 全部数据','📊')+'<div class="card"><h3>以往报告（点一条看详情）</h3>'+list+'</div><div class="tip">📊 保留最近7次报告；点任意一条可看完整数值。</div>';};
S['d_about_gsr']=function(){return head('了解皮肤电活动','📖')+'<div class="card"><h3>皮电是什么</h3><div class="para">皮肤电活动（GSR）通过皮肤表面的微弱电信号，反映出汗、紧张程度和放松状态。人在紧张、焦虑时出汗增多、皮电变化加快；放松时趋于平稳。</div></div><div class="card"><h3>主要数值怎么看</h3><div class="para">· 皮肤含水量：与出汗和皮肤状态有关；注意皮电单项和微体检模式的数值口径不同，不能直接对比，建议只看趋势。<br/>· 情绪等级：越高越积极，越低越偏紧张低落。<br/>· 抑郁风险：低为正常；中表示需留意情绪状态；高建议关注并与家人沟通，必要时就医。<br/>· 交感神经活跃度：反映身体紧张程度，长期偏高说明压力大、休息不足。<br/>· 皮质醇：压力激素，长期偏高与睡眠差、焦虑相关。</div></div><div class="card"><h3>老年人要注意什么</h3><div class="para">情绪和睡眠对身体影响很大。如果多次测出情绪偏低、抑郁风险升高，或皮质醇持续偏高，不要慌，先观察几天是否作息不规律、情绪波动；持续不好的话，建议和子女聊聊，必要时去医院心理科或神经内科检查。</div></div><div class="card"><h3>怎么改善</h3><div class="para">规律作息、每天散步晒太阳、和家人聊天、听放松的音乐、深呼吸练习，都有助于降低压力水平。测量时手腕放松、保持不动，结果更稳定。</div></div><div class="tip">⚠️ 皮电数据仅供情绪和压力趋势参考，不能诊断抑郁等疾病；具体请听医生意见。</div>';};

else if(histSelK==='fg_micro_hist'){name='微体检报告';body=rows([['❤️ 心率',(r.hr==null?'--':r.hr+' 次/分'),bcl(r.hr,60,100)],['🩸 血氧',(r.spo2==null?'--':r.spo2+'%'),bcl(r.spo2,95,100)],['🧘 压力',(r.stress==null?'--':r.stress),bcl(r.stress,0,59)],['🍚 血糖',(r.sugarMmol==null?'--':r.sugarMmol+' 毫摩尔/升'),bcl(r.sugarMmol,3.9,6.1)],['🌡 体温',(r.temp==null?'--':r.temp+' ℃'),bcl(r.temp,35.5,37.5)],['🩸 血压',(r.bph==null?'--':r.bph+'/'+r.bpl),(r.bph<130&&r.bpl<85)?'green':'orange'],['📈 HRV',(r.hrv==null?'--':r.hrv+' 毫秒'),bcl(r.hrv,40,400)],['🧪 尿酸',(r.uricAcid==null?'--':r.uricAcid+' 微摩尔/升'),bcl(r.uricAcid,150,430)],['总胆固醇',(r.tcho==null?'--':r.tcho+' 毫摩尔/升'),bcl(r.tcho,2.8,5.7)],['甘油三酯',(r.tag==null?'--':r.tag+' 毫摩尔/升'),bcl(r.tag,0.45,1.7)],['高密度脂蛋白',(r.hdl==null?'--':r.hdl+' 毫摩尔/升'),bcl(r.hdl,1.0,99)],['低密度脂蛋白',(r.ldl==null?'--':r.ldl+' 毫摩尔/升'),bcl(r.ldl,0,3.4)],['😵 疲劳度',(r.fatigue==null?'--':r.fatigue)],['抑郁风险',(r.depression==null?'--':(r.depression===0||r.depression==='0'||r.depression==='低'?'低':(r.depression===1||r.depression==='1'||r.depression==='中'?'中':(r.depression===2||r.depression==='2'||r.depression==='高'?'高':r.depression))))],['皮质醇浓度',(r.cortisol==null?'--':r.cortisol+' 微克/升'),(r.cortisol==null?'':bcl(r.cortisol,0,200))]]);}

S['identity']=function(){return '<div class="rolehead"><div class="k">请选择今天的使用方式</div><div class="s">选错也没关系，设置里可以随时切换</div></div><div class="rolegrid"><div class="rolecard elder" onclick="chooseRole(\'elder\')"><div class="ico">🧑‍🦳</div><h3>老人端</h3><p>首页 · 功能 · 设置<br/>看自己的健康数据</p></div><div class="rolecard child" onclick="chooseRole(\'child\')"><div class="ico">👨‍👩‍👧</div><h3>子女端</h3><p>家人 · 设置<br/>看家人的状态和提醒</p></div></div>';};
var ROLE='elder';
function applyRole(){document.body.classList.remove('role-elder','role-child','role-none');document.body.classList.add('role-'+(ROLE||'none'));}
function chooseRole(r){ROLE=r;localStorage.setItem('fg_role',r);applyRole();tab(r==='child'?'family':'home');toast(r==='child'?'已切换到子女端':'已切换到老人端');}
function switchRole(){try{pageRoleDialog();}catch(e){ROLE='';localStorage.removeItem('fg_role');applyRole();stack=['identity'];show('identity',false);}}
// 界面模式切换：只换本机界面（老人界面/子女界面），不影响数据采集与云端同步
function pageRoleDialog(){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center;';
  var inner=document.createElement('div');
  inner.style.cssText='background:#fff;border-radius:18px;padding:20px;width:82%;max-width:340px;';
  inner.innerHTML='<div style="font-size:17px;font-weight:800;color:#4A3428;margin-bottom:6px;">切换界面模式</div>'
   +'<div style="font-size:12px;color:#8A6A55;margin-bottom:14px;">只换手机上的界面，不影响数据采集和云端同步</div>'
   +'<div class="mbtn" style="margin:0 0 10px;" id="pr_elder">老人界面（首页/功能/设置，可手动监测）</div>'
   +'<div class="mbtn" style="margin:0;background:#F3EDE7;color:#4A3428;" id="pr_child">子女界面（家人/设置）</div>';
  d.appendChild(inner);document.body.appendChild(d);
  document.getElementById('pr_elder').onclick=function(){chooseRole('elder');d.remove();};
  document.getElementById('pr_child').onclick=function(){chooseRole('child');d.remove();};
}
applyRole();
if(ROLE){tab(ROLE==='child'?'family':'home');}else{stack=['identity'];show('identity',false);}
</script></body></html>
